name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Em PR, cancela rodadas anteriores ao novo push (economiza CI minutes).
  # Em main, mantém todas: cada commit precisa ser validado.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # "Security scan" e "CI passed" são required no ruleset "main protegida
  # (org)", que vale para todo repo da org, então os dois nomes não podem mudar.
  security:
    name: Security scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: a varredura dos commits do PR precisa da base.
          fetch-depth: 0

      # Binário direto em vez da action oficial: a action exige licença de
      # organização, o binário não.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks

      # SEM continue-on-error: segredo de verdade tem que quebrar o job.
      - name: Scan for secrets
        run: ./gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner -v

      # A árvore final não mostra o segredo que entrou num commit e saiu no
      # seguinte. Com merge commit, esse commit chega à main do mesmo jeito,
      # então o PR também varre os próprios commits.
      - name: Scan PR commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks detect --config .gitleaks.toml --redact --no-banner -v --log-opts="$BASE_SHA..$HEAD_SHA"

  ci-ok:
    name: CI passed
    needs: [security]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          ok() {
            case "$2" in
              success) echo "  ✓ $1 ($2)" ;;
              *) echo "  ✗ $1 ($2)" >&2; return 1 ;;
            esac
          }
          status=0
          ok "security" "${{ needs.security.result }}" || status=1
          [ "$status" -eq 0 ] && echo "CI OK"
          exit $status
